[package]
edition = "2021"
rust-version = "1.58.0"
name = "simplicity-lang"
version = "0.2.0"
authors = ["Andrew Poelstra <apoelstra@wpsoftware.net>"]
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "General purpose library for processing Simplicity programs"
homepage = "https://github.com/BlockstreamResearch/rust-simplicity/"
documentation = "https://docs.rs/simplicity-lang/"
readme = "README.md"
license = "CC0-1.0"
repository = "https://github.com/BlockstreamResearch/rust-simplicity/"

[lib]
name = "simplicity"
path = "src/lib.rs"

[dependencies]
byteorder = "1.3"
santiago = "1.3"

[dependencies.actual-serde]
version = "1.0.103"
features = ["derive"]
optional = true
package = "serde"

[dependencies.bitcoin]
version = "0.31.0"
optional = true

[dependencies.bitcoin-miniscript]
version = "11.0.0"
package = "miniscript"

[dependencies.elements]
version = "0.24.0"
optional = true

[dependencies.hashes]
version = "0.13"
package = "bitcoin_hashes"

[dependencies.hex]
version = "0.1.1"
package = "hex-conservative"

[dependencies.simplicity-sys]
version = "0.2.0"
